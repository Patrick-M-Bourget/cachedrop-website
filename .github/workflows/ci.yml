name: CI

on:
  pull_request:
  push:
    branches: [main, v1]

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Shared site checks
        run: scripts/check.sh site
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # The reference PNGs in handoff/screenshots/ were rendered on a Mac. Linux text rasterising
  # differs by more than a real layout change, so the comparison against them runs on macOS.
  reference-renders:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Shared reference-render checks
        run: scripts/check.sh reference
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-reference
          path: |
            playwright-report/
            test-results/
          retention-days: 7
