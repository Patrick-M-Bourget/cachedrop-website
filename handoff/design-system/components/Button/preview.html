<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Button — preview</title></head>
<body>
<div id="root" class="cd-root"></div>
<script>
var C = window.CacheDrop, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(
h('div', { className: 'cd-demo cd-demo--col' },
  h('div', { className: 'cd-demo', style: { padding: 0 } },
    h(C.Button, { size: 'lg', icon: 'download' }, 'Download Free Beta'),
    h(C.Button, { size: 'lg', variant: 'secondary' }, 'Give Fast Feedback'),
    h(C.Button, { size: 'sm' }, 'Get Free Beta')),
  h('div', { className: 'cd-demo', style: { padding: 0 } },
    h(C.Button, { shape: 'rounded', variant: 'secondary' }, 'Cancel'),
    h(C.Button, { shape: 'rounded' }, 'Submit Feedback'),
    h(C.Button, { shape: 'rounded', variant: 'quiet' }, 'Back to CacheDrop'),
    h(C.Button, { shape: 'rounded', variant: 'danger' }, 'Empty Trash')))
);
</script>
</body>
</html>
