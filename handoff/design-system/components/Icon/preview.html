<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Icon — preview</title></head>
<body>
<div id="root" class="cd-root"></div>
<script>
var C = window.CacheDrop, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(
h('div', { className: 'cd-demo', style: { gap: '20px' } },
  C.Icon.names.map(function (n) { return h('div', { key: n, title: n, style: { display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '6px', width: '64px', fontSize: '10px', color: 'var(--ink-secondary)' } }, h(C.Icon, { name: n, size: 20 }), n); }))
);
</script>
</body>
</html>
