<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>CodeBlock — preview</title></head>
<body>
<div id="root" class="cd-root"></div>
<script>
var C = window.CacheDrop, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(
h('div', { className: 'cd-demo cd-demo--col' },
  h(C.CodeBlock, { code: 'rm -rf ~/Library/Developer/Xcode/DerivedData/*' }),
  h(C.CodeBlock, { label: 'Path', code: '~/Library/Application Support/Adobe/Common/Media Cache Files' }))
);
</script>
</body>
</html>
