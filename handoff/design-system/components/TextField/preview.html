<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>TextField — preview</title></head>
<body>
<div id="root" class="cd-root"></div>
<script>
var C = window.CacheDrop, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(
h('div', { className: 'cd-demo cd-demo--col' },
  h(C.TextField, { id: 'p-email', label: 'Email', optional: true, type: 'email', placeholder: 'you@example.com' }),
  h(C.TextField, { id: 'p-email2', label: 'Email', type: 'email', defaultValue: 'pat@', error: 'Enter a full email address, like you@example.com.' }))
);
</script>
</body>
</html>
